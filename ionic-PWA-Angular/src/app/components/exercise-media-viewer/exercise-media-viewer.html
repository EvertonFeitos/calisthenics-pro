@if (hasVideo || hasImage) {
  <div class="bg-[#141414] border border-[#262626] rounded-[24px] overflow-hidden">
    <div class="flex items-center justify-between border-b border-[#222] px-3 py-2.5">
      <div class="flex items-center gap-1.5">
        @if (hasVideo) {
          <button
            type="button"
          (click)="activeTab = 'video'"
          [class]="activeTab === 'video'
              ? 'text-[10px] font-bold px-3 py-1 rounded-full border bg-indigo-500/10 border-indigo-500/30 text-indigo-300 flex items-center gap-1.5'
              : 'text-[10px] font-bold px-3 py-1 rounded-full border bg-[#181818] border-[#262626] text-[#888] flex items-center gap-1.5'"
          >
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"></path>
            </svg>
            Vídeo Tutorial
          </button>
        }
        @if (hasImage) {
          <button
            type="button"
          (click)="activeTab = 'image'"
          [class]="activeTab === 'image'
              ? 'text-[10px] font-bold px-3 py-1 rounded-full border bg-emerald-500/10 border-emerald-500/30 text-emerald-300 flex items-center gap-1.5'
              : 'text-[10px] font-bold px-3 py-1 rounded-full border bg-[#181818] border-[#262626] text-[#888] flex items-center gap-1.5'"
          >
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="m7 14 3-3 5 5 2-2 3 3"></path>
              <circle cx="9" cy="9" r="1"></circle>
            </svg>
            Foto / Ilustração
          </button>
        }
      </div>

      @if (collapsible) {
        <button
          type="button"
          (click)="isCollapsed = !isCollapsed"
          class="text-[10px] font-semibold text-[#888] hover:text-[#ccc] flex items-center gap-1"
        >
          <span>{{ isCollapsed ? 'Exibir' : 'Ocultar' }}</span>
          @if (isCollapsed) {
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          } @else {
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m6 15 6-6 6 6"></path>
            </svg>
          }
        </button>
      }
    </div>

    @if (!isCollapsed) {
      <div class="p-3">
        @if (activeTab === 'video' && hasVideo) {
          @if (videoType === 'mp4' && embedUrl) {
            <video
              class="w-full rounded-2xl border border-[#262626] bg-black aspect-video object-cover"
              controls
              playsinline
              [src]="embedUrl"
            ></video>
          } @else if (safeEmbedUrl) {
            <iframe
              class="w-full rounded-2xl border border-[#262626] bg-black aspect-video"
              [title]="'Vídeo de ' + exerciseName"
              [src]="safeEmbedUrl"
              loading="lazy"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          }
        }

        @if (activeTab === 'image' && hasImage) {
          <img
            [src]="imageUrl"
            [alt]="'Ilustração do exercício ' + exerciseName"
            (error)="handleImageError()"
            class="w-full rounded-2xl border border-[#262626] bg-black/20 object-cover"
          />
        }
      </div>
    }
  </div>
}
