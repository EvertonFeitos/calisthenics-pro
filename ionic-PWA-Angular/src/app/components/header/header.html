<header class="sticky top-0 z-30 bg-[#080808]/90 backdrop-blur-xl border-b border-[#222] text-[#F0F0F0] px-4 py-3.5 pt-safe">
  <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20 border border-indigo-400/30 shrink-0">
        <div class="w-4 h-4 border-2 border-white rounded-[4px] flex items-center justify-center">
          <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
        </div>
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="font-extrabold text-base tracking-tight text-[#F0F0F0] truncate">CALISTENIA</span>
          <span class="text-indigo-400 font-light text-sm tracking-widest underline underline-offset-4 decoration-1 shrink-0">
            PRO
          </span>
        </div>
        <p class="text-[11px] text-[#888] font-medium tracking-wide truncate">Bento Workout Engine</p>
      </div>
    </div>

    <div class="flex items-center gap-2.5 shrink-0">
      <div class="relative">
        <select
          id="level-selector-dropdown"
          [value]="currentLevelInfo().id"
          (change)="onSelectLevel($event)"
          class="appearance-none bg-[#161616] hover:bg-[#1f1f1f] border border-[#262626] hover:border-indigo-500/40 text-indigo-300 text-xs font-semibold py-2 pl-3.5 pr-8 rounded-full cursor-pointer focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner"
        >
          @for (level of levels(); track level.id) {
            <option [value]="level.id" class="bg-[#121212] text-[#F0F0F0]">
              {{ level.name }} ({{ level.badge }})
            </option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-[#888]">
          <svg class="fill-current h-3 w-3" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
          </svg>
        </div>
      </div>

      <button
        id="toggle-sound-btn"
        (click)="toggleSound.emit()"
        [attr.aria-label]="soundEnabled() ? 'Silenciar som' : 'Ativar som'"
        [class]="soundEnabled()
          ? 'p-2 rounded-full border transition-all bg-[#161616] border-indigo-500/40 text-indigo-400 hover:bg-[#202020] shadow-[0_0_10px_rgba(99,102,241,0.15)]'
          : 'p-2 rounded-full border transition-all bg-[#121212] border-[#262626] text-[#666] hover:text-[#aaa]'"
        [title]="soundEnabled() ? 'Sons ativados' : 'Sons desativados'"
      >
        @if (soundEnabled()) {
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
        } @else {
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
            <path d="m17 9 4 4"></path>
            <path d="m21 9-4 4"></path>
          </svg>
        }
      </button>

      <div class="hidden sm:flex items-center gap-2 bg-[#161616] border border-[#262626] px-3.5 py-1.5 rounded-full text-xs font-semibold text-[#F0F0F0]">
        <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.7)]"></div>
        <span class="tabular-nums font-bold text-xs">{{ completedWorkoutsCount() }}</span>
        <span class="text-[#888] text-[11px] font-normal">
          {{ completedWorkoutsCount() === 1 ? 'treino' : 'treinos' }}
        </span>
      </div>
    </div>
  </div>
</header>
