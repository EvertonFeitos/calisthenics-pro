<nav class="fixed bottom-3 left-0 right-0 z-30 pb-safe px-4 pointer-events-none">
  <div class="max-w-md mx-auto bg-[#121212]/95 backdrop-blur-xl border border-[#262626] shadow-2xl shadow-black/80 rounded-full px-3 py-1.5 flex items-center justify-between pointer-events-auto">
    @for (item of navItems; track item.id) {
      <a
        [routerLink]="['/app', item.id]"
        [id]="'nav-tab-' + item.id"
        [class]="currentTab() === item.id
          ? 'flex flex-col items-center justify-center py-1.5 px-3 rounded-full transition-all duration-200 bg-[#1c1c1c] text-indigo-400 font-bold border border-indigo-500/30 shadow-[0_0_12px_rgba(99,102,241,0.15)]'
          : 'flex flex-col items-center justify-center py-1.5 px-3 rounded-full transition-all duration-200 text-[#888] hover:text-[#F0F0F0] hover:bg-[#161616] font-medium'"
      >
        <div [class]="currentTab() === item.id ? 'transition-transform duration-200 scale-110 text-indigo-400' : 'transition-transform duration-200'">
          @switch (item.icon) {
            @case ('calendar') {
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <path d="M16 2v4M8 2v4M3 10h18"></path>
              </svg>
            }
            @case ('dumbbell') {
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M14.4 14.4 9.6 9.6"></path>
                <path d="M18.657 21.485a2.1 2.1 0 0 1-2.97 0l-1.8-1.8a2.1 2.1 0 0 1 0-2.97l4.8-4.8a2.1 2.1 0 0 1 2.97 0l1.8 1.8a2.1 2.1 0 0 1 0 2.97Z"></path>
                <path d="m21.5 21.5-1.4-1.4"></path>
                <path d="m2.5 2.5 1.4 1.4"></path>
                <path d="M5.343 8.515a2.1 2.1 0 0 1-2.97 0l-1.8-1.8a2.1 2.1 0 0 1 0-2.97l4.8-4.8a2.1 2.1 0 0 1 2.97 0l1.8 1.8a2.1 2.1 0 0 1 0 2.97Z"></path>
              </svg>
            }
            @case ('history') {
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 3v5h5"></path>
                <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
                <path d="M12 7v5l4 2"></path>
              </svg>
            }
            @case ('trendingUp') {
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="m22 7-8.5 8.5-5-5L2 17"></path>
                <path d="M16 7h6v6"></path>
              </svg>
            }
            @case ('sparkles') {
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"></path>
                <path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z"></path>
              </svg>
            }
            @default {
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z"></path>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06A2 2 0 1 1 4.3 16.93l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.07 4.3l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06A2 2 0 1 1 19.7 7.07l-.06.06A1.7 1.7 0 0 0 19.3 9c.2.63.8 1.05 1.47 1.05H21a2 2 0 1 1 0 4h-.23c-.67 0-1.27.42-1.47 1.05Z"></path>
              </svg>
            }
          }
        </div>
        <span class="text-[9px] uppercase tracking-wider font-semibold mt-0.5">{{ item.label }}</span>
      </a>
    }
  </div>
</nav>
