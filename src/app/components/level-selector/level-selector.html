<div class="bg-[#121212] border border-[#222222] rounded-[28px] p-5 shadow-lg space-y-4">
  <div>
    <span class="text-[#888] text-[10px] uppercase tracking-[0.2em] font-bold">NÍVEL DE TREINAMENTO</span>
    <h2 class="text-lg font-black text-[#F0F0F0] tracking-tight mt-1">Progressão de Força & Calistenia</h2>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
    @for (level of levels(); track level.id) {
      <button
        (click)="selectLevel.emit(level.id)"
        [class]="currentLevelId() === level.id
          ? 'text-left p-3.5 rounded-[22px] border border-indigo-500/50 ring-1 ring-indigo-500/40 bg-gradient-to-br from-[#1e1b4b]/60 to-[#121212] transition-all'
          : 'text-left p-3.5 rounded-[22px] border border-[#262626] bg-[#181818] hover:border-[#333] transition-all'"
      >
        <div class="flex items-start justify-between gap-2">
          <span [class]="currentLevelId() === level.id
            ? 'text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500 text-white'
            : 'text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-[#222] text-[#888]'">
            {{ level.badge }}
          </span>
          @if (currentLevelId() === level.id) {
            <svg class="w-4 h-4 text-indigo-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          }
        </div>
        <h3 class="text-sm font-black text-[#F0F0F0] mt-3">{{ level.name }}</h3>
        <p class="text-[11px] text-[#888] leading-relaxed mt-1 line-clamp-2">{{ level.description }}</p>
      </button>
    }
  </div>
</div>
