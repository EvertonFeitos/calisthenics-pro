@if (store.isLoading()) {
  <div class="min-h-screen bg-[#080808] text-[#F0F0F0] flex flex-col items-center justify-center p-4">
    <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
    <p class="text-xs font-bold text-[#888] tracking-widest uppercase">
      Carregando Calistenia Pro...
    </p>
  </div>
} @else {
  <div class="h-[100dvh] overflow-hidden bg-[#080808] text-[#F0F0F0] font-sans flex flex-col selection:bg-indigo-500 selection:text-white">
    <app-header
      [currentLevelInfo]="store.currentLevelInfo()"
      [levels]="store.levels()"
      [soundEnabled]="store.userSettings().soundEnabled"
      [completedWorkoutsCount]="store.sessions().length"
      (selectLevel)="handleSelectLevel($event)"
      (toggleSound)="handleToggleSound()"
    />

    <main class="flex-1 min-h-0 overflow-y-auto max-w-4xl mx-auto w-full px-4 pt-4 pb-24">
      <router-outlet></router-outlet>
    </main>

    <app-bottom-nav [currentTab]="currentTab()"></app-bottom-nav>
  </div>
}
